<html lang="vi">

    <title>81759 - TRẦN THỊ KHÁNH LY | Engineering Hub</title>

    <style>
        :root {
            --primary: #0088cc;
            --primary-dark: #006699;
            --primary-light: #e6f4fa;
            --bg: #f6f8fa;
            --surface: #ffffff;
            --text-main: #1f2328;
            --text-muted: #656d76;
            --border: #d0d7de;
            --border-light: #eaeef2;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-focus: 0 0 0 3px rgba(0, 136, 204, 0.25);
            --radius: 16px;
            --transition: all 0.2s ease-in-out;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --surface: #161b22;
                --text-main: #f0f6fc;
                --text-muted: #8b949e;
                --border: #30363d;
                --border-light: #21262d;
                --primary-light: #12283a;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #login-container {
            width: 100%;
            max-width: 410px;
        }

        .login-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 30px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0088cc 0%, #00d2ff 100%);
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #0088cc 0%, #00b4d8 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
            margin: 0 auto 14px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-light);
            border: none;
            margin: 0 0 20px 0;
        }

        .login-form-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .login-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: var(--transition);
        }

        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
            background-color: var(--surface);
        }

        button.btn-unlock {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.25);
            transition: var(--transition);
        }

        button.btn-unlock:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 136, 204, 0.35);
        }

        button.btn-unlock:active {
            transform: translateY(0);
        }

        #error {
            margin-top: 14px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #cf222e;
            background-color: rgba(207, 34, 46, 0.08);
            border: 1px solid rgba(207, 34, 46, 0.2);
            border-radius: 8px;
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            #error {
                color: #ff7b72;
                background-color: rgba(248, 81, 73, 0.1);
                border-color: rgba(248, 81, 73, 0.25);
            }
        }

        .auth-footer {
            margin-top: 22px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, pass);
                const originalText = bytes.toString(CryptoJS.enc.Utf8);
                
                if (!originalText) {
                    throw new Error("Wrong pass");
                }
                
                // Lưu pass vào session để đi sang trang khác không phải nhập lại
                sessionStorage.setItem('doc_password', pass);
                
                document.open();
                document.write(originalText);
                document.close();
            } catch (e) {
                if (!silent) errorDiv.style.display = 'block';
                else sessionStorage.removeItem('doc_password');
            }
        }
    </script>
</body>
</html>
