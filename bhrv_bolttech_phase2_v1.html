## 1. Tổng quan Yêu cầu Thay đổi (Executive Summary)

### 1.1 Vấn đề cốt lõi của Hiện trạng (Phase 1)

Hiện tại, API tạo đơn BHRV của Bolttech (`CreateCustomerFulfillOrder`) yêu cầu **bắt buộc phải có số IMEI** ngay tại thời điểm tạo đơn. Điều này chỉ phù hợp với các đơn hàng bán tại cửa hàng (Store Pickup) khi thiết bị có sẵn.

Tuy nhiên, đối với các sản phẩm kích thước lớn (ví dụ: TV ≥ 55"), hàng hóa chỉ được lưu trữ tại Kho Trung Tâm (Central Warehouse) và **giao hàng sau 2-7 ngày**.
Khi Khách hàng thanh toán tiền bảo hiểm tại Cửa hàng vào Ngày 1, hệ thống chưa có IMEI. Hệ thống kế toán (AR) bắt buộc phải tạo đơn Bolttech ngay khi thu tiền để cân bằng sổ sách, nhưng không thể thực hiện do thiếu IMEI.

### 1.2 Mục tiêu của Phase 2

Mở rộng hệ thống để hỗ trợ luồng **Giao hàng từ Kho (Warehouse Delivery)** bằng cách:

1. Cho phép tạo đơn bảo hiểm ở trạng thái **Pending / Draft** tại cửa hàng (chưa cần IMEI).
2. Cho phép cập nhật IMEI và kích hoạt (Fulfill) đơn bảo hiểm tại kho khi hàng hóa bắt đầu được xuất đi giao.

## 2. Luồng Nghiệp vụ Mong muốn (Desired Business Flow)

Quy trình bán hàng cho sản phẩm giao từ kho sẽ được chia làm 2 giai đoạn:

### Day 1 - Tại Cửa hàng (Store)

1. **Lấy giá bảo hiểm:** Hệ thống gọi API `GetPartnerProduct` để lấy danh sách gói bảo hiểm và giá.
2. **Tạo đơn Tạm (Dummy Order):** NVST tạo đơn bảo hiểm trên hệ thống. Erablue tự động sinh và truyền **số Serial tạm (Dummy IMEI)** cùng **Ngày kích hoạt tạm (Dummy Activation Date)** vào API `CreateCustomerFulfillOrder` của Bolttech.
3. **Thu tiền:** NVST thu tiền bảo hiểm từ khách hàng (AR được cân bằng).
4. **Lấy Số Hợp Đồng Bảo Hiểm:** Erablue gọi API `GetOrder` (kèm OrderID) để lấy về số hợp đồng dịch vụ TecProtec chính thức (với thông tin thiết bị tạm thời) từ Bolttech.

### Day 2-7 - Tại Kho (Warehouse)

4. **Xuất hàng:** Hệ thống Kho tiến hành xuất sản phẩm vật lý. Lúc này **đã có số IMEI thực tế**.
5. **Cập nhật IMEI & Kích hoạt:** Nhân viên Kho (hoặc hệ thống tự động) nhập IMEI vào hệ thống. Hệ thống gọi API `UpdateContract` để truyền IMEI sang Bolttech và hoàn tất đơn (Fulfill).
6. **Bảo hiểm có hiệu lực:** Hợp đồng được kích hoạt với ngày hiệu lực dựa trên thỏa thuận.

## 3. Phân tích Tích hợp API (Bolttech APIs)

Theo thỏa thuận, API nội bộ `CreateContract` của Bolttech sẽ bị loại bỏ khỏi luồng của ERABLUE. Danh mục API cần tích hợp phía ERABLUE bao gồm 4 API sau (lưu ý: `GetPartnerProduct` và `GetOrder` **đã được tích hợp sẵn từ Phase 1**, không phải API mới - chỉ có `CreateCustomerFulfillOrder` (dùng workaround dummy value) và `UpdateContract` (hoàn toàn mới) là phần thay đổi trọng tâm của Phase 2):

> **Ghi chú Thuật ngữ:** Trong ngành bảo hiểm (hoặc các dịch vụ bảo vệ thiết bị như Bolttech TechProtect), **"Premium"** mang ý nghĩa là **"Phí bảo hiểm"**. Do đó, API `GetPartnerProduct` (Check Premium) có nhiệm vụ trả về "Premium fee" (Phí bảo hiểm).

|     STT     | Tên API                       |  Method  | Chức năng chính                                                            |                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |
| :---------: | :----------------------------- | :------: | :---------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| **1** | `GetPartnerProduct`          | `GET` | Lấy giá/phí bảo hiểm tại cửa hàng                                     | •**Trạng thái:** `[GIỮ NGUYÊN]`• **Mục đích:** Lấy danh sách các gói bảo hiểm và phí bảo hiểm (Premium fee) tương ứng trực tiếp từ Bolttech ngay khi tư vấn tại cửa hàng.• **Lưu ý:** Không yêu cầu truyền IMEI.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        |
| **2** | `CreateCustomerFulfillOrder` | `POST` | Tạo đơn hàng bảo hiểm (thông tin tạm)                                 | •**Trạng thái:** `[GIỮ NGUYÊN CẤU TRÚC - DÙNG DUMMY VALUE CHO SẢN PHẨM TIVI]`• **Mục đích:** Tạo đơn bảo hiểm trên Bolttech ngay tại Ngày 1 để thu tiền qua POS và cân bằng sổ sách kế toán (AR).• **Quy định truyền Dummy Value (đối với hàng giao từ kho):**&nbsp;&nbsp;- **`device_unique_id`** *(MANDATORY)*: Truyền chuỗi dummy **`999999999999`** (12 chữ số 9) cho sản phẩm TV Erablue.&nbsp;&nbsp;- **`device_activation_date`** *(MANDATORY)*: Truyền ngày dummy **`0001-01-01T00:00:00Z`** (chuẩn UTC `YYYY-MM-DDTHH:MM:SSZ`).• **Kết quả:** Nhận về `order_id` (Mã đơn Bolttech); hợp đồng ở trạng thái chờ IMEI (`fulfillment-pending`).                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        |
| **3** | `GetOrder`                   | `GET` | Kiểm tra trạng thái đơn & lấy số hợp đồng chính thức              | •**Trạng thái:** `[GIỮ NGUYÊN API - DÙNG ĐỂ RETRY]`• **Mục đích:** Kiểm tra trạng thái đơn (`fulfillment-pending`) và lấy số hợp đồng dịch vụ chính thức (`service_contract_number`).• **Thời điểm gọi:** Ngay sau khi gọi API 2 thành công ở Ngày 1. Do CRMZ xử lý bất đồng bộ qua hàng đợi nên `service_contract_number` có thể chưa sẵn sàng ngay $\rightarrow$ hệ thống cần **retry (gọi lại nhiều lần)** API này cho đến khi lấy được giá trị.• **Tham số truyền (Query Param):**&nbsp;&nbsp;- `order_id`: Mã đơn hàng Bolttech vừa nhận được từ API 2 (hoặc `partner_order_id` của Erablue).&nbsp;&nbsp;- `partner_code`: Mã đối tác Erablue.• **Dữ liệu cần trích xuất:** Lấy về **`service_contract_number`** (Số hợp đồng bảo hiểm chính thức và duy nhất) và lưu trữ vào Database để dùng cho API 4.                                                                                                                                                                                                                                                                                                                       |
| **4** | `UpdateContract`             | `PUT` | Cập nhật IMEI thật và kích hoạt hợp đồng khi giao hàng thành công | •**Trạng thái:** `[MỚI]`• **Mục đích:** Cập nhật số Serial/IMEI thực tế và ngày kích hoạt thật khi hàng được xuất kho giao cho khách (Ngày 2~7).• **Request Param (Query URL - Dùng để định vị hợp đồng cũ):**&nbsp;&nbsp;- `partner_code`: Mã đối tác Erablue.&nbsp;&nbsp;- `partner_onboarding_order_id`: Mã đơn hàng Erablue lúc onboarding.&nbsp;&nbsp;- `service_contract_number`: Số hợp đồng dịch vụ chính thức (lấy từ API 3).&nbsp;&nbsp;- `device_unique_id`: Số Serial/IMEI dummy cũ (`999999999999`).&nbsp;&nbsp;- `device_id_type`: Loại mã định danh cũ (`serial-number` hoặc `imei`).• **Request Body (JSON Payload - Ghi đè thông tin thật):**&nbsp;&nbsp;- **`device_unique_id`** *(Optional - New)*: Số IMEI / Serial Number **thật** xuất từ kho.&nbsp;&nbsp;- **`device_id_type`** *(Optional - New)*: Loại mã định danh thật (`imei` hoặc `serial-number`).&nbsp;&nbsp;- **`device_activation_date`** *(MANDATORY)*: Ngày kích hoạt thật = Ngày giao hàng thật (`YYYY-MM-DDTHH:MM:SSZ`).&nbsp;&nbsp;- **`customer_contract_status`** *(Optional)*: Trạng thái hợp đồng (mặc định: `"ACTIVE"`). |

> [!NOTE]
> **1. Quy định Dummy Value từ tài liệu đặc tả Bolttech (`CreateCustomerFulfillOrder` ver 2.1 - Siju Pillai):**
>
> - **`device_unique_id`**: *"Unique identification IMEI / Serial Number - Set to dummy value of `999999999999` in case of Erablue TV product (Set as dummy for Erablue for the particular product code)"*
> - **`device_activation_date`**: *"Activation date of the device - For Erablue it will pass dummy value for particular product code: `0001-01-01T00:00:00Z` (format YYYY-MM-DDTHH:MM:SSZ)"*
>
> **2. Quy định Request Body & URL Param từ đặc tả Bolttech (`UpdateContract` ver 1.8 - Siju Pillai):**
>
> - **Method:** `PUT` (Endpoint: `/contract/customercontracts`)
> - **Request Param (URL):** Dùng để định vị hợp đồng: `partner_code`, `partner_onboarding_order_id`, `service_contract_number`, `device_unique_id` (Dummy cũ: `999999999999`), `device_id_type`.
> - **Request Body (JSON):** Chuẩn tên field theo đặc tả: `device_unique_id` (IMEI thật mới), `device_id_type` (loại mã định danh), `device_activation_date` (ngày giao hàng thật), `customer_contract_status` (`"ACTIVE"`).

## 4. Những Thay đổi Kỹ thuật Cần Thiết trong Hệ thống ERABLUE

### 4.1 Luồng bán hàng chính (User Stories)

Bảng dưới đây hợp nhất quy trình bán hàng của cả 2 Phase, giúp đối chiếu rõ ràng sự khác biệt trong từng bước thực hiện:

#### 4.1.1 Chi tiết Quy tắc Kiểm tra Điều kiện Mua BHRV (Validation Rules)

> 🔗 **Link Khai báo Chương trình bảo hiểm tham chiếu (ERP) hiện nay:**
> https://newweberp.thegioididong.com/#!/insurancedetails/10659

Sau khi NVST chọn sản phẩm chính (theo IMEI hoặc theo dòng đơn hàng SO), hệ thống POS tiến hành kiểm tra tính hợp lệ dựa trên các điều kiện cấu hình/khai báo của Chương trình bảo hiểm (theo link ERP ở trên) trước khi cho phép đi tiếp:

* **Trường hợp 1: Sản phẩm xuất tại siêu thị (Validate đích danh ở mức IMEI):**

  1. Số IMEI phải tồn tại trong hệ thống xuất bán của ERABLUE.
  2. Thời điểm mua bảo hiểm phải nằm trong khung thời gian cho phép kể từ lúc xuất bán sản phẩm chính.
     * Chương trình 10659 : đang khai báo [Số ngày được mua bảo hiểm] = 1 ngày.
  3. Giá bán của IMEI nằm trong khung giá/band giá được phép mua bảo hiểm.
  4. Sản phẩm thỏa mãn các điều kiện cấu hình: Hãng sản xuất, Nhóm hàng áp dụng, Trạng thái máy (máy mới).
  5. Số IMEI này chưa từng được đăng ký gói BHRV tại bất kỳ nhà cung cấp (NCC) nào khác.
     *(Nếu không thỏa điều kiện $\rightarrow$ Hiển thị thông báo lý do lỗi trên POS và dừng luồng).*
* **Trường hợp 2: Sản phẩm giao hàng từ kho (Validate ở mức Sản phẩm - Chưa có IMEI):**

  1. **Mã đơn hàng SO sản phẩm chính phải đang ở trạng thái [Chưa xuất].**
  2. Dòng sản phẩm (Detail) được chọn phải thuộc danh mục áp dụng chương trình BHRV (ví dụ: Tivi $\ge$ 55", Tủ lạnh, Máy giặt...).
     * **Hardcode hoặc tạo config, hoặc sửa khai báo Chương trình bảo hiểm, nhóm hàng nào cho phép chạy theo luồng mới phase 2 này (truyền dummy value).**
  3. Thời điểm mua bảo hiểm nằm trong khung thời gian hợp lệ tính từ lúc lập đơn hàng SO.
  4. Giá bán của dòng sản phẩm nằm trong khung giá/band giá khai báo của chương trình bảo hiểm.
  5. Dòng sản phẩm này trong đơn hàng SO chưa từng được liên kết mua gói BHRV nào trước đó.
     *(Nếu thỏa mãn điều kiện $\rightarrow$ Chuyển sang Bước 4 gọi API `GetPartnerProduct` để lấy biểu phí).*

### 4.2 Backend (Hệ thống xử lý API)

- API `GetPartnerProduct` đã được tích hợp sẵn từ Phase 1 (dùng để lấy giá trực tiếp từ Bolttech) — Phase 2 **không cần xây mới**, chỉ tái sử dụng nguyên trạng.
- Điều chỉnh payload của `CreateCustomerFulfillOrder`: Thay vì bắt buộc NVST nhập IMEI, đối với sản phẩm giao sau như Tivi, thì hệ thống mặc định truyền:
  - **Dummy IMEI (`device_unique_id = "999999999999"`)**
  - **Dummy Activation Date (`device_activation_date = "0001-01-01T00:00:00Z"`)** đối với các đơn hàng giao từ kho theo đúng quy chuẩn đặc tả của Bolttech.
- API `GetOrder` cũng đã có sẵn từ Phase 1; Phase 2 chỉ bổ sung logic gọi **retry (lặp lại nhiều lần)** ngay sau khi tạo đơn thành công cho đến khi lấy được số Hợp đồng Dịch vụ chính thức (Service Contract Number) — do CRMZ xử lý bất đồng bộ qua hàng đợi nên kết quả có thể chưa có ngay lần gọi đầu tiên.
- Viết job/hàm gọi API `UpdateContract` khi có tín hiệu xuất kho (đã có IMEI thật và Ngày giao thật) từ hệ thống ERP/WMS. Xử lý kịch bản lỗi nếu `UpdateContract` thất bại (Retry mechanism).

#### 4.2.1 Đặc tả Chi tiết các API Tích hợp (API Specifications)

##### 1. API GetPartnerProduct (Tra cứu Phí bảo hiểm - Check Premium) — *API đã có sẵn, không phải API mới*

* **Endpoint:** `/v1/integration/product/partnerproduct`
* **Method:** `GET`
* **Thời điểm gọi:** Ngày 1 - Khi NVST chọn sản phẩm chính và tư vấn gói BHRV tại màn hình POS.
* **Ghi chú:** API này đã được ERABLUE tích hợp và gọi từ Phase 1, Phase 2 không có thay đổi kỹ thuật nào đối với API này.
* **Request Headers:**
  * `bolt-tenant-id`: Định danh Tenant đối tác (ví dụ: `DigitalNinja`).
  * `bolt-country-code`: `ID` (Indonesia).
  * `bolt-language-code`: `ID` (hoặc `EN`).
  * `Authorization`: `Bearer <token>`
* **Request Query Parameters:**
  * `partner_code` *(string, MANDATORY)*: Mã đối tác Erablue do Bolttech cấp.
  * `device_rrp` *(float, MANDATORY)*: Giá bán lẻ đề xuất của sản phẩm chính (Recommended Retail Price).
  * `deviceType` *(string, MANDATORY)*: Loại thiết bị (`SMARTPHONES`, `TABLET`, `LAPTOP`, `TV`...).
  * `tenure` *(string/int, MANDATORY)*: Thời hạn bảo hiểm (tháng, ví dụ: `12`).
  * `coverageCodes` *(string, Optional)*: Mã gói bảo vệ nếu có yêu cầu lọc cụ thể.
* **Xử lý Response:**
  * Trả về danh sách gói cước (`plans`): Hệ thống trích xuất `product_id`, `plan_id` và giá trị **`totalPlanRRPWithTax`** (đây chính là phí bảo hiểm Premium fee cần hiển thị trên POS để thu tiền khách).

##### 2. API CreateCustomerFulfillOrder (Tạo đơn hàng bảo hiểm với thông tin tạm)

* **Endpoint:** `/v1/order/create-customer-fulfill`
* **Method:** `POST`
* **Thời điểm gọi:** Ngày 1 - Ngay khi khách hàng đồng ý mua và thanh toán tiền bảo hiểm thành công qua máy POS.
* **Request Headers:** Common Headers (`bolt-tenant-id`, `bolt-country-code: ID`, `bolt-language-code`, `Authorization`) + `Content-Type: application/json`.
* **Request Body Payload (JSON):**
  * **Thông tin đối tác & đơn hàng:**
    * `partner_code` *(string, MANDATORY)*: Mã đối tác Erablue.
    * `partner_order_id` *(string, MANDATORY)*: Mã đơn hàng POS của Erablue.
    * `product_id` *(string, MANDATORY)*: Mã gói bảo hiểm đã chọn từ API 1.
    * `plan_id` *(string, OPTIONAL / B2B MANDATORY)*: Mã plan tương ứng.
    * `device_rrp` *(float, MANDATORY)*: Giá bán lẻ của thiết bị.
  * **Thông tin khách hàng:**
    * `first_name` *(string, OPTIONAL)*: Tên khách hàng.
    * `last_name` *(string, MANDATORY for Erablue)*: Họ và tên đệm của khách hàng.
    * `phone_mobile_number` *(string, MANDATORY)*: Số điện thoại khách hàng.
    * `email` *(string, MANDATORY for Erablue)*: Địa chỉ email nhận hợp đồng điện tử.
  * **Thông số Dummy (Quy định bắt buộc đối với hàng giao từ kho như Tivi):**
    * `device_unique_id` *(string, MANDATORY)*: Truyền chuỗi cố định **`"999999999999"`** (12 chữ số 9).
    * `device_activation_date` *(timestamp, MANDATORY)*: Truyền ngày cố định **`"0001-01-01T00:00:00Z"`** (chuẩn UTC).
    * `device_id_type` *(string, MANDATORY)*: Truyền `"serial-number"` (cho Tivi/Gia dụng) hoặc `"imei"`.
* **Xử lý Response:**
  * `order_id`: Mã đơn hàng UUID do Bolttech sinh ra. **Hệ thống bắt buộc lưu trữ vào Database Erablue**.
  * `order_status`: Trả về trạng thái `"fulfillment-pending"` (chờ kích hoạt IMEI thật).
  * `_status.code`: `"80001"` (Thành công).

##### 3. API GetOrder (Kiểm tra trạng thái & Lấy số Hợp Đồng Dịch Vụ chính thức) — *API đã có sẵn, Phase 2 chỉ bổ sung retry*

* **Endpoint:** `/v1/order`
* **Method:** `GET`
* **Thời điểm gọi:** Ngày 1 - Gọi ngay sau khi API `CreateCustomerFulfillOrder` trả về kết quả thành công.
* **Ghi chú:** API này đã có sẵn từ Phase 1. Do Bolttech CRMZ xử lý tạo hợp đồng bất đồng bộ qua hàng đợi (queue), giá trị `service_contract_number` có thể **chưa sẵn sàng ngay ở lần gọi đầu tiên** $\rightarrow$ Phase 2 bổ sung cơ chế **retry (gọi lại định kỳ)** cho đến khi lấy được giá trị hoặc hết số lần thử quy định.
* **Request Headers:** Common Headers.
* **Request Query Parameters:**
  * `order_id` *(string, MANDATORY)*: Mã đơn hàng Bolttech vừa nhận được từ API 2.
  * `partner_code` *(string, MANDATORY)*: Mã đối tác Erablue.
* **Xử lý Response:**
  * `service_contract_number`: Số hợp đồng dịch vụ TecProtec chính thức do Bolttech CRMZ khởi tạo (ví dụ: `BESAMBENUB2026...`). Nếu chưa có, hệ thống **retry** lại việc gọi API này.
  * `order_status`: Trả về trạng thái `"fulfillment-pending"` (do thiết bị chưa được giao từ kho).
  * **Hành động Backend:** **Bắt buộc lưu giá trị `service_contract_number` này vào CSDL** (liên kết với đơn bảo hiểm) để làm khóa truy vấn khi gọi API `UpdateContract` ở giai đoạn xuất kho.

##### 4. API UpdateContract (Cập nhật IMEI thật & Kích hoạt bảo hiểm khi EraBlue giao hàng thành công)

* **Endpoint:** `/v1/contract/customercontracts`
* **Method:** `PUT` *(Lưu ý chuẩn Method là PUT theo tài liệu đặc tả Bolttech)*
* **Thời điểm gọi:** Ngày 2~7 - Khi hệ thống Kho (WMS) xuất hàng vật lý, quét được số IMEI/Serial thật và tiến hành **giao hàng thành công** cho khách.
* **Request Headers:** Common Headers + `Content-Type: application/json`.
* **Request Query Parameters (Dùng trên URL để định vị hợp đồng cũ):**

  * `partner_code` *(string, MANDATORY)*: Mã đối tác Erablue.
  * `partner_onboarding_order_id` *(string, MANDATORY for Erablue)*: Mã đơn hàng POS Erablue lúc onboarding.
  * `service_contract_number` *(string, MANDATORY for Asia)*: Số hợp đồng dịch vụ chính thức lấy từ API 3 (`GetOrder`).
  * `device_unique_id` *(string, MANDATORY for Erablue)*: Số Serial/IMEI dummy cũ đã dùng ở Ngày 1 (**`"999999999999"`**).
  * `device_id_type` *(string, MANDATORY for Erablue)*: Loại định danh cũ (`"serial-number"` hoặc `"imei"`).
* **Request Body Payload (JSON - Dùng để ghi đè thông tin thật):**

  ```json
  {
    "customer_contract_status": "ACTIVE",
    "device_unique_id": "847592837482910",
    "device_id_type": "serial-number",
    "device_activation_date": "2026-08-28T09:30:00Z"
  }
  ```

  * `device_unique_id` *(string, Optional - New)*: Số Serial / IMEI **thật** xuất từ kho.
  * `device_id_type` *(string, Optional - New)*: Loại định danh thật (`"serial-number"` cho TV hoặc `"imei"`).
  * `device_activation_date` *(timestamp, MANDATORY)*: Ngày kích hoạt thật = Ngày giao hàng thực tế (chuẩn UTC `YYYY-MM-DDTHH:MM:SSZ`).
  * `customer_contract_status` *(string, Optional)*: Trạng thái hợp đồng, truyền `"ACTIVE"`.
* **Xử lý Response:**

  * `customer_contract_number`: Số hợp đồng bảo hiểm chính thức.
  * `customer_contract_status`: Trả về `"ACTIVE"`.
  * `_status.code`: `"80001"` (Thành công). Phía Bolttech sẽ hoàn tất hợp đồng và tự động gửi Welcome Email lần 2 kèm E-cert chính thức cho khách hàng.
  * **Cơ chế Retry:** Nếu gọi API thất bại (lỗi mạng hoặc timeout), hệ thống Backend cần đưa vào hàng đợi (Queue) để tự động Retry với cơ chế Exponential Backoff.

### 4.3 Frontend (POS / Web)

- **Tại Màn hình Bán hàng (POS / Web Cửa hàng):**
  - **Thay đổi cơ chế tìm kiếm:** Bỏ cơ chế bắt buộc nhập/quét IMEI để lấy thông tin sản phẩm (do các sản phẩm giao từ kho như Tivi chưa có IMEI vật lý tại cửa hàng).
  - **Tìm kiếm theo Mã đơn hàng (Sales Order - SO):** Cho phép NVST nhập mã đơn hàng SO để truy vấn danh sách các sản phẩm trong đơn.
  - **Chọn đích danh dòng sản phẩm (Detail):** Cho phép NVST chọn đích danh sản phẩm cần mua kèm gói BHRV từ danh sách chi tiết đơn hàng SO.
  - **Kiểm tra điều kiện chương trình:** Hệ thống tự động đối chiếu thông tin sản phẩm được chọn với cấu hình/khai báo của chương trình bảo hiểm (nhóm hàng, phân khúc giá, điều kiện áp dụng...).
  - **Tách luồng bán Bảo hiểm cho đích danh IMEI và không đích danh IMEI:** Cho phép hoàn tất đơn bán và tiến hành thu tiền bình thường.

### 4.4 Database (Lưu trữ Dữ liệu)

- **Đây là nội dung gợi ý từ AI, team IT Product toàn quyền quyết định cách lưu trữ dữ liệu.**
- Bảng `PM_INSURANCETRANSACTION` (hoặc tương đương) cần thêm cột hoặc trạng thái mới:
  - `INSURANCE_STATUS`: `PENDING_IMEI` (Chờ IMEI), `FULFILLED` (Đã có IMEI, thành công).
  - Cần lưu lại `bolttech_order_id` ngay khi gọi hàm Create để tái sử dụng cho hàm Update và hàm GetOrder.
  - Bổ sung cột lưu trữ `service_contract_number` (Số hợp đồng bảo hiểm) lấy về từ API `GetOrder`.
  - Cột `INSURANCE_ACTIVATION_DATE`: Chỉ cập nhật khi hàng thực sự được giao/xuất kho.

## 5. Câu hỏi Cần Làm Rõ với Bolttech (Pending Confirmations)

Dựa trên Sequence Diagram từ Bolttech, một số vấn đề đã được làm rõ, nhưng vẫn còn một số câu hỏi mở:

1. ✅ **[Đã rõ] API Tương thích:** Bolttech chọn phương án dùng lại `CreateCustomerFulfillOrder` bằng cách truyền **IMEI Dummy** (workaround).
2. **[Chờ xác nhận] Timeout của đơn Pending:** Đơn bảo hiểm được phép nằm ở trạng thái "Dummy IMEI" tối đa bao nhiêu ngày trước khi bị hủy?
3. **[Chờ xác nhận] Hoàn tiền & Hủy đơn Pending:** Nếu Khách hàng đổi ý và hủy đơn trong lúc hàng chưa giao, Erablue hủy đơn như thế nào?
4. ✅ **[Đã rõ] Ngày kích hoạt bảo hiểm (Activation Date):** Ngày kích hoạt chính thức là **Ngày Giao Hàng** (Actual device activation date = delivery date), truyền trong hàm `UpdateContract`.

> [!WARNING]
> **Lưu ý về Trải nghiệm Khách hàng (Customer Experience):**
> Theo sơ đồ của Bolttech, khách hàng sẽ nhận được **2 Email Welcome**.
>
> - Lần 1: Ngay lúc thanh toán tại cửa hàng (chứa IMEI Dummy).
> - Lần 2: Lúc giao hàng (chứa IMEI Thật + E-cert).
>   👉 BA cần note cho NVST/Team Training dặn dò Khách hàng trước để KH không bị hoang mang khi nhận Email lần 1 có thông tin Dummy.

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const mdContent = document.getElementById("md-content").textContent;
            marked.setOptions({ gfm: true, breaks: true });
            document.getElementById("content").innerHTML = marked.parse(mdContent);
            
            // KÃ­ch hoáº¡t Syntax Highlighting CHá»ˆ cho cÃ¡c block cÃ³ khai bÃ¡o ngÃ´n ngá»¯ (trÃ¡nh tÃ´ mÃ u lung tung cho plain text)
            document.querySelectorAll('pre code').forEach((block) => {
                if (block.className.match(/language-(?!mermaid)/)) {
                    hljs.highlightElement(block);
                }
            });
            
            // Render Mermaid diagrams
            const mermaidBlocks = document.querySelectorAll("code.language-mermaid");
            mermaidBlocks.forEach(block => {
                const pre = block.parentElement;
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                pre.replaceWith(div);
            });
            const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mermaid.initialize({ startOnLoad: false, theme: isDarkMode ? 'dark' : 'default' });
            mermaid.init(undefined, document.querySelectorAll('.mermaid'));

            // Wrap tables in responsive div
            const tables = document.querySelectorAll('#content table');
            tables.forEach(table => {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-responsive-wrapper';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });

            // Generate TOC
            const tocContent = document.getElementById("toc-content");
            const headings = document.querySelectorAll("#content h1, #content h2, #content h3, #content h4");
            const ul = document.createElement("ul");
            headings.forEach(heading => {
                if (!heading.id) heading.id = heading.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
                const level = parseInt(heading.tagName.replace('H', ''), 10);
                const li = document.createElement("li");
                li.style.marginLeft = (level - 1) * 15 + "px";
                const a = document.createElement("a");
                a.href = "#" + heading.id;
                a.textContent = heading.textContent;
                li.appendChild(a);
                ul.appendChild(li);
            });
            tocContent.appendChild(ul);
        });
    </script>
